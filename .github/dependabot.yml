version: 2
# Every environment pin has an updater here, so bumps arrive as reviewed pull requests
# (the Workstation workflow rebuilds the container for each). Feature option values
# (tool versions in devcontainer.json) are bumped by hand; see the README.
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    labels: [dependencies, ci]
  # Feature references and devcontainer-lock.json digests.
  - package-ecosystem: devcontainers
    directories: [/, /devcontainer-features]
    schedule:
      interval: weekly
    labels: [dependencies, environment]
    # One pull request per dependency across both directories: the shared lint tools move together.
    groups:
      devcontainer-features:
        group-by: dependency-name
        patterns: ['*']
  # FROM digests in the workstation's and the collection's lint Dockerfiles.
  - package-ecosystem: docker
    directories: [/.devcontainer, /devcontainer-features/.devcontainer]
    schedule:
      interval: weekly
    labels: [dependencies, environment]
    groups:
      dockerfile-images:
        group-by: dependency-name
        patterns: ['*']
  # uv.lock (the workstation's Python tools).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, environment]
