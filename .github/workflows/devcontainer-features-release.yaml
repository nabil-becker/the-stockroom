name: Devcontainer Features - publish
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit containing the merged bundle pin
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/check-artifact-versions
        with:
          scope: devcontainer-features
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: 'true'
          base-path-to-features: ./devcontainer-features/src
          features-namespace: nabil-becker/devcontainer-features
          disable-repo-tagging: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
