name: Artifact versions
on:
  pull_request:
    paths:
      - 'versions/**'
      - 'tools/versioning/**'
      - 'Taskfile.yml'
      - 'devcontainer-features/src/*/devcontainer-feature.json'
      - 'devcontainer-features/components/*/COMPONENT_VERSION'
      - 'devcontainer-features/src/facilitator/facilitator/__init__.py'
      - '.github/actions/check-artifact-versions/**'
      - '.github/actions/setup-uv/**'
      - '.github/workflows/artifact-versions.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.devcontainer/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-uv
      - run: |
          uv run --locked python -m unittest discover -s tools/versioning
          uv run --locked python tools/versioning/artifacts.py check
