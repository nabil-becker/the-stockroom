name: Devcontainer Features - lint
on:
  pull_request:
    paths:
      - 'devcontainer-features/**'
      - 'Taskfile.yml'
      - '.github/workflows/devcontainer-features-*.yaml'
  push:
    branches: [main]
    paths:
      - 'devcontainer-features/**'
      - 'Taskfile.yml'
      - '.github/workflows/devcontainer-features-*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash devcontainer-features/.devcontainer/stage-features.sh
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          subFolder: devcontainer-features
          configFile: devcontainer-features/.devcontainer/ci/devcontainer.json
          push: never
          runCmd: |
            set -eu
            cd "$(git rev-parse --show-toplevel)"
            yamllint -c devcontainer-features/.yamllint --strict .github/workflows/devcontainer-features-*.yaml
            task devcontainer-features:lint devcontainer-features:docs:check
