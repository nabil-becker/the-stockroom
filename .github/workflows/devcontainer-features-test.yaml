name: Devcontainer Features - test
on:
  pull_request:
    paths:
      - 'devcontainer-features/**'
      - '!devcontainer-features/docs/**'
      - '.github/workflows/devcontainer-features-test.yaml'
  push:
    branches: [main]
    paths:
      - 'devcontainer-features/**'
      - '!devcontainer-features/docs/**'
      - '.github/workflows/devcontainer-features-test.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-features-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: devcontainer-features

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        name: Find published Features and their tests
        run: |
          set -eu
          for dir in src/*/; do
            id=$(basename "$dir")
            jq -e --arg id "$id" '.id == $id' "$dir/devcontainer-feature.json" >/dev/null
            test -f "test/$id/test.sh" || { echo "Missing test/$id/test.sh"; exit 1; }
            test -f "$dir/NOTES.md" || { echo "Missing $dir/NOTES.md"; exit 1; }
          done
          ids=$(jq -sc 'map(.id) | sort' src/*/devcontainer-feature.json)
          echo "features=$ids" >> "$GITHUB_OUTPUT"

  test-autogenerated:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.inventory.outputs.features) }}
        image: [debian:latest, ubuntu:latest, 'mcr.microsoft.com/devcontainers/base:debian']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @devcontainers/cli
      - run: devcontainer features test -p . -f "$FEATURE" -i "$IMAGE" --skip-scenarios
        env:
          FEATURE: ${{ matrix.feature }}
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-scenarios:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.inventory.outputs.features) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @devcontainers/cli
      - run: devcontainer features test -p . -f "$FEATURE" --skip-autogenerated --skip-duplicated
        env:
          FEATURE: ${{ matrix.feature }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @devcontainers/cli
      - run: devcontainer features test -p . --global-scenarios-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    if: always()
    needs: [inventory, test-autogenerated, test-scenarios, test-global]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to succeed
        working-directory: .
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs) }}
