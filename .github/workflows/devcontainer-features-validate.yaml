name: Devcontainer Features - validate
on:
  pull_request:
    paths:
      - 'devcontainer-features/src/**'
      - '.github/workflows/devcontainer-features-validate.yaml'
  push:
    branches: [main]
    paths:
      - 'devcontainer-features/src/**'
      - '.github/workflows/devcontainer-features-validate.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: 'true'
          base-path-to-features: ./devcontainer-features/src
